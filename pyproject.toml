[project]
name = "grow-millions-mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanusha Sahu", email = "tanushasahu16@gmai.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mcp[cli]<2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
grow-millions-mcp-server = "grow_millions_mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]